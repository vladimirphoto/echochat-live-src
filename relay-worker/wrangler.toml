name = "echochat-relay"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Очередь на Durable Objects (SQLite-хранилище доступно на бесплатном плане)
[[durable_objects.bindings]]
name = "QUEUE"
class_name = "Queue"

# База лицензий (ключи, устройства, ключ подписи)
[[durable_objects.bindings]]
name = "LICENSES"
class_name = "Licenses"

# Донаты Каспи только для Pro/пробного периода. "0" — отдавать всем (старые версии приложения не присылают лицензию),
# "1" — проверять лицензию на сервере. Включать, когда большинство людей обновилось до 2.1.0 и новее.
[vars]
ENFORCE_DONATIONS = "0"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Queue"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Licenses"]

# Секрет ADMIN_TOKEN (вход в /admin) задаётся в панели Cloudflare: Workers → echochat-relay → Settings → Variables and Secrets
