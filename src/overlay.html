<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ЭхоЧат LIVE — оверлей чата</title>
  <link rel="stylesheet" href="overlay.css" />
</head>
<body>
  <div class="panel" id="panel">
    <header class="top" id="top">
      <span class="badge off" id="badge">ОФЛАЙН</span>
      <span class="time" id="time">—</span>
      <span class="grow"></span>
      <button class="ib" id="btnLock" type="button" title="Заблокировать положение окна"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.2"/><path id="lockShackle" d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg></button>
      <button class="ib" id="btnSet" type="button" title="Настройки оверлея"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      <button class="ib close" id="btnClose" type="button" title="Закрыть оверлей"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </header>

    <section class="stats" id="stats">
      <span class="st" id="stTt" title="Зрители TikTok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.4"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.8a3.4 3.4 0 0 1 0 6.4M18 14.2a6.5 6.5 0 0 1 3.5 5.8"/></svg><b id="vTt">—</b></span>
      <span class="st" id="stTw" title="Зрители Twitch" hidden><svg class="tw-ic" viewBox="0 0 24 24" fill="currentColor"><path d="M4 2 2.5 6v14H8v2.5h3L13.5 20H18l3.5-3.5V2H4zm15.5 13-2.5 2.5h-4.5L10 20v-2.5H6V4h13.5v11zM16 7.5h-2v5h2v-5zm-5 0H9v5h2v-5z"/></svg><b id="vTw">—</b></span>
      <span class="st" id="stViews" title="Просмотры: сколько человек зашло за весь эфир"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><b id="vViews">—</b></span>
      <span class="st" title="Подарки"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4.5" rx="1"/><path d="M5 12.5V20h14v-7.5M12 8v12M12 8c-1.5-4-6-4-6-1.5S10 8 12 8zm0 0c1.5-4 6-4 6-1.5S14 8 12 8z"/></svg><b id="vGifts">0</b></span>
      <span class="st" title="Новые подписки"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.6"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M19 8v6M16 11h6"/></svg><b id="vFollows">0</b></span>
      <span class="st" title="Лайки"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5s-8-4.7-8-10.6A4.6 4.6 0 0 1 12 7a4.6 4.6 0 0 1 8 2.9c0 5.9-8 10.6-8 10.6z"/></svg><b id="vLikes">0</b></span>
    </section>

    <div class="pop" id="pop" hidden>
      <div class="pop-row"><label for="sOpacity">Прозрачность фона</label><b id="sOpacityV">100%</b></div>
      <input type="range" id="sOpacity" min="0" max="100" value="100" />
      <label class="sw"><input type="checkbox" id="sOnTop" checked /><i></i><span>Поверх всех окон</span></label>
      <label class="sw"><input type="checkbox" id="sEvents" checked /><i></i><span>Подарки, репосты и подписки в ленте</span></label>
      <label class="sw"><input type="checkbox" id="sJoins" checked /><i></i><span>Строка внизу: кто зашёл и кто лайкает</span></label>
      <label class="sw"><input type="checkbox" id="sHearts" checked /><i></i><span>Лайки (летящие сердечки)</span></label>
      <label class="sw"><input type="checkbox" id="sStats" checked /><i></i><span>Счётчики эфира</span></label>
      <button class="clear" id="btnClear" type="button">Очистить чат</button>
    </div>

    <main class="wrap">
      <div class="feed" id="feed"></div>
      <div class="empty" id="empty">Здесь появится чат TikTok и Twitch.<br />Подключитесь к эфиру в приложении ЭхоЧат.</div>
      <button class="down" id="down" type="button" hidden>↓ Новые сообщения</button>
    </main>
    <div class="joinbar" id="joinBar" aria-live="off"></div>

    <div class="hearts" id="hearts" aria-hidden="true"></div>

    <i class="grip e" data-dir="e"></i><i class="grip w" data-dir="w"></i><i class="grip s" data-dir="s"></i><i class="grip se" data-dir="se"></i><i class="grip sw" data-dir="sw"></i>
  </div>
  <script src="overlay-ui.js"></script>
</body>
</html>
