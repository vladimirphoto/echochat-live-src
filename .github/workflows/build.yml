name: Build Windows exe

on:
  push:
    branches: [main]
    paths-ignore:
      - 'relay-worker/**'
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

# два запуска подряд не должны одновременно публиковать один и тот же релиз
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check publish token
        shell: bash
        env:
          T: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: test -n "$T" || { echo "::error::Нет секрета PUBLIC_REPO_TOKEN (Settings, Secrets and variables, Actions)"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Electron и инструменты electron-builder (winCodeSign, nsis) качаются с github.com, который иногда отвечает 504
      # (так упали сборки 2.4.0 и 2.4.1). Скачанное кладём в кэш, чтобы следующие сборки не зависели от этих загрузок.
      - name: Restore Electron download cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-dl-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            electron-dl-${{ runner.os }}-
      # установка и сборка идут с повторными попытками и длинными паузами
      - name: Install dependencies (with retry)
        shell: pwsh
        run: |
          for ($i = 1; $i -le 5; $i++) {
            npm install
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "::warning::npm install failed (attempt $i of 5), retrying in 60s"
            Remove-Item -Recurse -Force node_modules -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 60
          }
          exit 1
      - name: Build portable exe (with retry)
        shell: pwsh
        run: |
          for ($i = 1; $i -le 5; $i++) {
            npm run dist
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "::warning::npm run dist failed (attempt $i of 5), retrying in 60s"
            Start-Sleep -Seconds 60
          }
          exit 1
      # установщик для установленной версии: она обновляется сама, скачивая файл с «Setup» в имени
      - name: Build Setup installer (with retry)
        shell: pwsh
        run: |
          for ($i = 1; $i -le 5; $i++) {
            npm run dist:setup
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "::warning::npm run dist:setup failed (attempt $i of 5), retrying in 60s"
            Start-Sleep -Seconds 60
          }
          exit 1
      # сохраняем кэш сразу после сборки, даже если дальше упадёт автотест: загрузки к этому моменту уже скачаны
      - name: Save Electron download cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-dl-${{ runner.os }}-${{ github.run_id }}

      # Автотест собранного приложения: открывает окно, нажимает кнопки,
      # синтезирует голоса, проверяет подключение к несуществующему эфиру.
      - name: Self-test packaged app
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist/win-unpacked -Filter *.exe | Where-Object { $_.Name -notmatch 'uninstall|elevate' } | Select-Object -First 1
          Write-Host "Testing $($exe.FullName)"
          $out = Join-Path $PWD 'selftest.json'
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '--selftest',"--out=$out" -PassThru
          if (-not $p.WaitForExit(240000)) { $p.Kill(); Write-Host 'TIMEOUT: app did not finish' }
          if (Test-Path $out) {
            $r = Get-Content $out -Raw | ConvertFrom-Json
            Write-Host "=== SELFTEST v$($r.version) electron $($r.electron) ==="
            foreach ($t in $r.results) {
              $mark = if ($t.ok) { 'PASS' } else { 'FAIL' }
              Write-Host ("[{0}] [{1}] {2} :: {3}" -f $mark, $t.group, $t.name, $t.detail)
              if (-not $t.ok) { $m = ("{0} :: {1}" -f $t.name, $t.detail) -replace "`r|`n",' '; Write-Host ("::error title=SELFTEST FAIL [{0}]::{1}" -f $t.group, $m) }
            }
            Write-Host "critical failed: $($r.criticalFailed)"
            $md = @("### Автотест сборки v$($r.version) (Electron $($r.electron))", "", "| Результат | Группа | Проверка | Детали |", "|---|---|---|---|")
            foreach ($t in $r.results) { $d = ("$($t.detail)" -replace '\|','/' -replace "`r|`n",' '); if ($d.Length -gt 140) { $d = $d.Substring(0,140) }; $md += ("| {0} | {1} | {2} | {3} |" -f $(if ($t.ok) {'PASS'} else {'FAIL'}), $t.group, $t.name, $d) }
            Set-Content -Path selftest.md -Value ($md -join "`n") -Encoding UTF8
            if ($r.criticalFailed -gt 0) { exit 1 }
          } else {
            Write-Host '::error title=SELFTEST::no result file - app failed to start or crashed'
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: EchoChat-LIVE-exe
          path: dist/EchoChat-LIVE-*.exe
      - name: Read version
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # копия установщика с постоянным именем: ссылка .../releases/latest/download/EchoChat-LIVE-Setup.exe на сайте всегда ведёт на свежую версию
      - name: Fixed-name installer copy
        shell: bash
        run: cp "dist/EchoChat-LIVE-Setup-${{ steps.ver.outputs.v }}.exe" dist/EchoChat-LIVE-Setup.exe
      # исходники закрыты: релиз с готовыми exe публикуется в отдельный публичный репозиторий
      # (нужен секрет PUBLIC_REPO_TOKEN: токен GitHub с правом Contents: Read and write на jonny-chat-tiktok)
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          repository: vladimirphoto/jonny-chat-tiktok
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          tag_name: v${{ steps.ver.outputs.v }}
          name: ЭхоЧат LIVE ${{ steps.ver.outputs.v }}
          body_path: selftest.md
          files: dist/EchoChat-LIVE-*.exe
