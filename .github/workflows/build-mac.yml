name: Build macOS dmg

# Запускается вручную (Actions → Build macOS dmg → Run workflow) и прикладывает .dmg к релизу текущей версии.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist:mac

      # Автотест собранного приложения: запускаем его на самом macOS, как это делает Windows-сборка.
      # Заодно печатаем, что про приложение думает Gatekeeper, и причину, если оно не стартовало.
      - name: Self-test packaged app
        continue-on-error: true
        run: |
          APP="$(ls -d dist/mac-arm64/*.app | head -1)"
          echo "Testing $APP"
          echo "::notice title=MAC INFO::macOS $(sw_vers -productVersion) $(uname -m) | codesign: $(codesign --verify --deep --strict "$APP" 2>&1 | tr '\n' ' ' | head -c 300) | spctl: $(spctl --assess --type execute -vv "$APP" 2>&1 | tr '\n' ' ' | head -c 300)"
          OUT="$PWD/selftest.json"
          BIN="$(ls "$APP"/Contents/MacOS/* | head -1)"
          "$BIN" --selftest "--out=$OUT" > selftest.stdout 2>&1 &
          PID=$!
          for i in $(seq 1 90); do kill -0 $PID 2>/dev/null || break; sleep 2; done
          kill $PID 2>/dev/null || true
          if [ -f "$OUT" ]; then
            node tools/selftest-report.js "$OUT"
          else
            echo "::error title=SELFTEST::no result file - app failed to start or crashed"
            echo "::error title=APP OUTPUT::$(tr '\n' ' ' < selftest.stdout | head -c 1500)"
            CR="$(ls -t ~/Library/Logs/DiagnosticReports/*EchoChat* 2>/dev/null | head -1)"
            if [ -n "$CR" ]; then echo "::error title=CRASH REPORT::$(head -c 1500 "$CR" | tr '\n' ' ')"; fi
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: EchoChat-LIVE-dmg
          path: dist/*.dmg
      - name: Read version
        id: ver
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          repository: vladimirphoto/jonny-chat-tiktok
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          tag_name: v${{ steps.ver.outputs.v }}
          name: ЭхоЧат LIVE ${{ steps.ver.outputs.v }}
          files: dist/*.dmg
